name: TVsport Nightly Data Scrape

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape and Update fixtures.json
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: nightly-scrape
      cancel-in-progress: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Fetch pre-scraped liveonsat.json
        # liveonsat.com blocks GitHub's IP ranges, so run_liveonsat.bat on a
        # home PC scrapes it into Dropbox and this step pulls it from there.
        # Missing/empty secret or a failed download is NOT fatal: the merger
        # falls back to EPG + rights.
        env:
          LIVEONSAT_JSON_URL: ${{ secrets.LIVEONSAT_JSON_URL }}
        run: |
          if [ -z "$LIVEONSAT_JSON_URL" ]; then
            echo "LIVEONSAT_JSON_URL secret not set - skipping"; exit 0
          fi
          URL="${LIVEONSAT_JSON_URL/dl=0/dl=1}"
          curl -sSL --max-time 60 -o output/liveonsat.json "$URL" || { echo "download failed"; rm -f output/liveonsat.json; exit 0; }
          python3 -c "import json;d=json.load(open('output/liveonsat.json'));print('liveonsat.json:',len(d['fixtures']),'fixtures, fetched',d.get('fetched_at'))" || rm -f output/liveonsat.json

      - name: Run TVsport scraper
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          LIVEONSAT_JSON_PATH: ../output/liveonsat.json
        run: |
          cd scraper
          python merger.py

      - name: Audit fixture data
        if: always()
        run: |
          python scraper/audit_fixtures.py || true
          python scraper/liveonsat_audit.py > /dev/null || true
          if [ -f output/liveonsat_audit.md ]; then
            cat output/liveonsat_audit.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Health check (fails the run -> GitHub emails you)
        # Only conditions that need a human. Rights mismatches and coverage
        # gaps are a backlog, not an alarm, so they stay in the summary only.
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, subprocess
          from datetime import datetime, timezone
          problems = []
          now = datetime.now(timezone.utc)

          # 1. liveonsat.json present and fresh (run_liveonsat.bat on the PC)
          if not os.path.exists("output/liveonsat.json"):
              problems.append("liveonsat.json missing - PC scrape or Dropbox link not working")
          else:
              d = json.load(open("output/liveonsat.json"))
              try:
                  age = (now - datetime.fromisoformat(d["fetched_at"].replace("Z", "+00:00"))).days
              except Exception:
                  age = 99
              if age > 3:
                  problems.append(f"liveonsat.json is {age} days old - has run_liveonsat.bat stopped running?")
              if len(d.get("fixtures", [])) < 200:
                  problems.append(f"liveonsat.json has only {len(d.get('fixtures', []))} fixtures - page structure may have changed")

          # 2. fixtures.json sanity
          f = json.load(open("output/fixtures.json"))
          n = f.get("fixture_count", len(f.get("fixtures", [])))
          if n < 100:
              problems.append(f"fixtures.json has only {n} fixtures - a source has probably failed")
          prev = subprocess.run(["git", "show", "HEAD:output/fixtures.json"], capture_output=True, text=True)
          if prev.returncode == 0:
              try:
                  pn = json.loads(prev.stdout).get("fixture_count", 0)
                  if pn and n < pn * 0.6:
                      problems.append(f"fixture count dropped from {pn} to {n} (>40%)")
              except Exception:
                  pass

          # 3. the ROI pick actually landed on at least one blackout match
          #    (only meaningful when there are blackout fixtures in range)
          bo = [x for x in f["fixtures"] if x.get("is_blackout")]
          roi = [x for x in bo if any(b.get("source") == "liveonsat" for b in x["broadcasters"])]
          if bo and not roi and os.path.exists("output/liveonsat.json"):
              problems.append(f"{len(bo)} blackout fixtures but no liveonsat-confirmed ROI pick - matching may be broken")

          if problems:
              print("::error::HEALTH CHECK FAILED")
              for p in problems:
                  print(f"::error::{p}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
                  fh.write("\n\n## :rotating_light: Health check failed\n\n" + "\n".join(f"- {p}" for p in problems) + "\n")
              sys.exit(1)
          print("health check OK")
          PYEOF

      - name: Validate fixtures.json
        run: |
          python3 - <<'PYEOF'
          import json, sys
          with open('output/fixtures.json') as f:
              data = json.load(f)
          count = data.get('fixture_count', 0)
          print(f'Fixture count: {count}')
          if count == 0:
              print('ERROR: fixtures.json is empty')
              sys.exit(1)
          print('Validation passed')
          PYEOF

      - name: Commit updated fixtures.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/fixtures.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            COUNT=$(python3 -c "import json; print(json.load(open('output/fixtures.json'))['fixture_count'])")
            git commit -m "Update fixtures.json — ${COUNT} fixtures [skip ci]"
            git push
          fi

      - name: Job summary
        if: always()
        run: |
          python3 - >> $GITHUB_STEP_SUMMARY <<'PYEOF'
          import json
          try:
              data = json.load(open('output/fixtures.json'))
              fixtures = data.get('fixtures', [])
              from collections import Counter
              comps = Counter(f['competition'] for f in fixtures)
              print('## TVsport Scrape Summary')
              print(f"Generated at: {data.get('generated_at','unknown')}")
              print(f"Total fixtures: {data.get('fixture_count',0)}")
              print()
              print('### By competition:')
              for comp, count in sorted(comps.items()):
                  print(f'- {comp}: {count}')
          except Exception as e:
              print(f'Could not generate summary: {e}')
          PYEOF
