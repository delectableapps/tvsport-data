name: Nightly TVsport Data Scrape

on:
  schedule:
    # Run at 2:00am UTC every night
    - cron: '0 2 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Python setup ────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scraper/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      # ── Node.js setup (for iptv-org/epg EPG tool) ───────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache iptv-org/epg clone
        uses: actions/cache@v4
        with:
          path: scraper/sources/epg/iptv-org-epg
          key: iptv-org-epg-${{ hashFiles('scraper/sources/epg/epg_channels.xml') }}
          restore-keys: |
            iptv-org-epg-

      # ── Run all scrapers ─────────────────────────────────────────────
      - name: Run TVsport scraper pipeline
        run: |
          cd scraper
          python merger.py
        env:
          PYTHONUNBUFFERED: "1"

      # ── Validate output ──────────────────────────────────────────────
      - name: Validate fixtures.json
        run: |
          python3 -c "
          import json, sys
          with open('output/fixtures.json') as f:
              data = json.load(f)
          fixtures = data.get('fixtures', data) if isinstance(data, dict) else data
          count = len(fixtures)
          print(f'✅ fixtures.json valid — {count} fixtures')
          if count == 0:
              print('❌ ERROR: No fixtures found')
              sys.exit(1)

          # Print summary by competition
          by_comp = {}
          for fx in fixtures:
              c = fx.get('competition', '?')
              by_comp[c] = by_comp.get(c, 0) + 1
          for comp, n in sorted(by_comp.items()):
              print(f'   {comp:<16} {n}')
          "

      # ── Commit and push ──────────────────────────────────────────────
      - name: Commit fixtures.json
        run: |
          git config user.name  "TVsport Bot"
          git config user.email "bot@tvsport.live"
          git add output/fixtures.json
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "🤖 Nightly update: $(date -u +'%Y-%m-%d %H:%M UTC') — $(python3 -c \"import json; d=json.load(open('output/fixtures.json')); fxs=d.get('fixtures',d) if isinstance(d,dict) else d; print(len(fxs))\" 2>/dev/null || echo '?') fixtures"

      - name: Push to GitHub
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
